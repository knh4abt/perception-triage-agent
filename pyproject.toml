# Tool settings only (the project is run with python -m, not installed as a package).
# Written out explicitly so local runs and CI apply exactly the same rules.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # pycodestyle, pyflakes, import order, bugbear, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import triage_agent without installing it
